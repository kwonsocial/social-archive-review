    wb.type = 'button'; wb.dataset.ext = 'wordbook'; wb.innerHTML = '단어장 <b data-wb-count>0</b>';
    nav.insertBefore(tree, growth); nav.insertBefore(wb, growth);
    const chip = document.createElement('button');
    chip.type = 'button'; chip.className = 'account-chip'; chip.dataset.ext = 'account';
    chip.innerHTML = '<small>학습 코드</small><b data-account-label>—</b>';
    nav.append(chip);
    refreshChrome();
  }
  function refreshChrome(){
    const n = WB ? WB.count() : 0;
    document.querySelectorAll('[data-wb-count]').forEach(el => { el.textContent = n; el.hidden = n === 0; });
    document.querySelectorAll('[data-account-label]').forEach(el => { el.textContent = A ? (A.activeId() ? A.pretty(A.activeId()) : '없음') : '없음'; });
    document.querySelectorAll('[data-tree-count]').forEach(el => { el.textContent = TG ? `${TG.cleared()} / ${TG.total()}` : '0'; });
  }
  if (WB) WB.subscribe(refreshChrome);

  // ---------- 학습 코드 시작 안내 ----------
  function gate(){
    if (!A || A.decided()) return;
    const box = document.createElement('div');
    box.className = 'code-gate'; box.id = 'codeGate';
    box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-labelledby','codeGateTitle');
    box.innerHTML = gateStart();
    document.body.append(box);
    box.querySelector('button')?.focus();
  }
  function gateStart(){
    return `<div class="code-panel"><span class="eyebrow">MY LEARNING CODE</span>
      <h2 id="codeGateTitle">학습 코드로 시작할까요?</h2>
      <p>학습 코드가 있으면 틀린 개념이 <b>내 단어장</b>에 쌓이고, 개념 트리와 키워드 게임 기록이 따로 저장돼요.</p>
      <p class="small muted">${PRIVACY}</p>
      <div class="row"><button class="btn" data-ext="code-new">새 학습 코드 만들기</button>
      <button class="ghost" data-ext="code-open-join">코드로 이어하기</button>
      <button class="ghost" data-ext="code-skip">코드 없이 둘러보기</button></div></div>`;
  }
  function gateMade(id){
    return `<div class="code-panel"><span class="eyebrow">MY LEARNING CODE</span>
      <h2 id="codeGateTitle">학습 코드가 만들어졌어요.</h2>
      <p class="code-big">${A.pretty(id)}</p>
      <p>이 코드를 공책에 적어 두세요. 다음에 이 코드를 넣으면 내 단어장과 기록을 이어서 쓸 수 있어요.</p>
      <label class="code-field"><span>별명 (선택, 실명은 쓰지 않기)</span>
      <input id="codeNick" type="text" maxlength="12" placeholder="예: 사회탐험가" autocomplete="off"></label>
      <div class="row"><button class="btn" data-ext="code-start">시작하기 →</button></div></div>`;
  }
  function gateJoin(message){
    return `<div class="code-panel"><span class="eyebrow">MY LEARNING CODE</span>
      <h2 id="codeGateTitle">학습 코드를 넣어 주세요.</h2>
      <label class="code-field"><span>학습 코드 8자리 (예: 2026-0417)</span>
      <input id="codeInput" type="text" inputmode="numeric" maxlength="9" placeholder="20260417" autocomplete="off"></label>
      ${message ? `<p class="tree-notice warn">${esc(message)}</p>` : ''}
      <p class="small muted">이 기기에서 만든 코드만 이어 쓸 수 있어요.</p>
      <div class="row"><button class="btn" data-ext="code-join">이어하기 →</button>
      <button class="ghost" data-ext="code-back">뒤로</button></div></div>`;
  }
  const gateHTML = html => { const g = document.getElementById('codeGate'); if (g) { g.innerHTML = html; g.querySelector('input,button')?.focus(); } };
  const closeGate = () => document.getElementById('codeGate')?.remove();

  // ---------- 학습 코드 화면 ----------
  function accountView(){
    closeModal(); activeUnit = null;
    const id = A.activeId(), me = A.active(), list = A.list();
    setScreen('account', `<div class="wrap">
      <div class="section-heading"><div><span class="eyebrow">MY LEARNING CODE</span><h1>내 학습 코드</h1>
      <p class="muted">코드마다 기본 개념 연결·키워드 게임·개념 트리·단어장 기록이 따로 저장돼요.</p></div></div>
      <div class="card code-card">
        ${id ? `<p class="code-big">${A.pretty(id)}</p>${me && me.nick ? `<p><b>${esc(me.nick)}</b></p>` : ''}
          <label class="code-field"><span>별명 바꾸기 (실명은 쓰지 않기)</span>
          <input id="nickInput" type="text" maxlength="12" value="${esc(me && me.nick || '')}" autocomplete="off"></label>
          <div class="row"><button class="btn secondary" data-ext="code-rename">별명 저장</button>
          <button class="ghost" data-ext="code-signout">코드 없이 이용하기</button></div>`
        : `<p><b>지금은 학습 코드 없이 이용하고 있어요.</b></p>
          <p class="small muted">코드를 만들면 단어장과 기록이 내 코드에만 저장돼요.</p>
          <div class="row"><button class="btn" data-ext="code-new-inline">새 학습 코드 만들기</button></div>`}
      </div>
      <h2 class="chapter-label">이 기기에 저장된 코드 ${list.length}개</h2>
      ${list.length ? `<div class="completion-list code-list">${list.map(a => `<div><span>${A.pretty(a.id)}${a.nick ? ' · ' + esc(a.nick) : ''}${a.id === id ? ' <b>(지금 사용 중)</b>' : ''}</span>
        <span class="row">${a.id === id ? '' : `<button class="ghost small" data-ext="code-switch" data-id="${a.id}">이 코드로 전환</button>`}
        <button class="ghost small" data-ext="code-forget" data-id="${a.id}">삭제</button></span></div>`).join('')}</div>`
        : '<p class="small muted">아직 만든 코드가 없어요.</p>'}
      <div class="row" style="margin-top:18px"><button class="ghost" data-ext="code-new-inline">코드 추가로 만들기</button>
      <button class="ghost" data-ext="code-open-join-screen">다른 코드로 이어하기</button></div>
      <div class="growth-note"><p><b>개인정보 안내</b> ${PRIVACY}</p>
      <p>학습 코드는 게임이 만들어 주는 숫자이고, 학교에서 쓰는 실제 학번과는 관계가 없어요.</p></div>
    </div>`);
  }

  // ---------- 단어장 ----------
  let wbUnit = '', quiz = null;
  function wordbookView(scroll = true){
    closeModal(); activeUnit = null; quiz = null;
    const all = WB.all();
    const shown = wbUnit ? all.filter(i => i.unitId === wbUnit) : all;
    const due = all.filter(i => !i.mastered);
    const unitIds = [...new Set(all.map(i => i.unitId))];
    setScreen('wordbook', `<div class="wrap">
      <div class="recall-heading"><div><span class="eyebrow">MY WORD BOOK</span><h1>내 단어장</h1>
      <p class="muted">틀린 개념은 자동으로 담기고, 개념 도감에서 직접 담을 수도 있어요.</p></div>
      <span class="recall-count"><b>${all.length}</b>개 · 더 볼 개념 ${due.length}개</span></div>
      ${A && !A.activeId() ? '<p class="tree-notice">학습 코드 없이 이용 중이에요. 코드를 만들면 단어장이 내 코드에만 저장됩니다. <button class="recall-text-button" data-ext="account">학습 코드 만들기</button></p>' : ''}
      ${all.length ? `
        <div class="row tree-top-actions">
          <button class="btn" data-ext="wb-quiz" ${due.length ? '' : 'disabled'}>단어장으로 다시 학습 (${due.length}개) →</button>
          <button class="ghost" data-ext="glossary-jump">개념 도감에서 담기</button>
          <button class="ghost" data-ext="wb-clear">단어장 비우기</button>
        </div>
        <div class="book-filter" role="group" aria-label="단원 선택">
          <button class="tab ${wbUnit ? '' : 'active'}" data-ext="wb-filter" data-id="" aria-pressed="${!wbUnit}">전체 ${all.length}</button>
          ${unitIds.map(uid => { const u = window.SOCIAL_UNITS.find(x => x.id === uid); const n = all.filter(i => i.unitId === uid).length;
            return `<button class="tab ${wbUnit === uid ? 'active' : ''}" data-ext="wb-filter" data-id="${uid}" aria-pressed="${wbUnit === uid}">사회${u.book === 1 ? '①' : '②'} ${u.number}단원 ${n}</button>`; }).join('')}
        </div>
        <div class="wb-list">${shown.map(i => `<article class="wb-item ${i.mastered ? 'mastered' : ''}">
          <div class="concept-meta"><span>사회${i.book === 1 ? '①' : '②'} · ${i.number}단원 · ${i.page}쪽</span>
          <span>${i.mastered ? '익힘 ✓' : (i.misses > 1 ? `${i.misses}번 막힘` : esc(i.reason))}</span></div>
          <h3>${esc(i.term)}</h3><p>${esc(i.definition)}</p>
          ${i.compare ? `<div class="comparison">${esc(i.compare)}</div>` : ''}
          <div class="row"><button class="ghost small" data-ext="wb-remove" data-id="${i.id}">단어장에서 빼기</button>
          ${i.mastered ? `<button class="ghost small" data-ext="wb-again" data-id="${i.id}">다시 더 볼 개념으로</button>` : ''}</div></article>`).join('')}</div>`
        : `<div class="card"><h3>아직 담긴 개념이 없어요.</h3>
          <p class="muted">키워드 게임이나 개념 트리에서 막힌 개념이 자동으로 담깁니다. 개념 도감에서 ☆ 표시를 눌러 직접 담을 수도 있어요.</p>
          <div class="row"><button class="btn" data-ext="glossary-jump">개념 도감 열기</button><button class="ghost" data-ext="tree">개념 트리 하기</button></div></div>`}
    </div>`, scroll);
  }

  // ---------- 단어장 다시 학습 ----------
  function quizStart(){
    const pool = WB.all().filter(i => !i.mastered);
    if (!pool.length) { toast('지금은 더 볼 개념이 없어요.'); return; }
    const order = [...pool].sort(() => Math.random() - 0.5);
    quiz = {order, index:0, input:'', hinted:false, status:'pending', message:'', right:0, wrong:0};
    quizRender();
  }
  function quizRender(scroll = true){
    const q = quiz.order[quiz.index];
    const ini = window.RecallGame ? window.RecallGame.initials(q.term) : '';
    setScreen('wb-quiz', `<div class="wrap screen">
      <div class="topline"><div><span class="eyebrow">WORD BOOK · REVIEW</span>
      <div class="small muted">사회${q.book === 1 ? '①' : '②'} · ${q.number}단원 · ${q.page}쪽</div></div>
      <button class="ghost small" data-ext="wordbook">단어장으로</button></div>
      <div class="progress" aria-label="${quiz.index + 1} / ${quiz.order.length}">${quiz.order.map((_,i) => `<i class="${i < quiz.index ? 'done' : i === quiz.index ? 'current' : ''}"></i>`).join('')}</div>
      <div class="card wb-quiz-card">
        <p class="small muted">${quiz.index + 1} / ${quiz.order.length} · 뜻을 읽고 개념을 써 보세요.</p>
        <p class="wb-quiz-def">${esc(q.definition)}</p>
        ${quiz.hinted ? `<p class="wb-quiz-hint">초성 힌트 <b>${esc(ini)}</b></p>` : ''}
        ${quiz.status === 'pending' ? `<label class="code-field"><span>개념 쓰기</span>
          <input id="wbAnswer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(quiz.input)}"></label>
          ${quiz.message ? `<p class="tree-notice ${quiz.hinted ? 'warn' : ''}">${esc(quiz.message)}</p>` : ''}
          <div class="row"><button class="btn" data-ext="wb-submit">확인</button>
          <button class="ghost" data-ext="wb-hint" ${quiz.hinted ? 'disabled' : ''}>초성 힌트</button>
          <button class="ghost" data-ext="wb-reveal">정답 보기</button></div>`
        : `<p class="wb-quiz-answer ${quiz.status === 'correct' ? 'ok' : 'no'}">${quiz.status === 'correct' ? '맞았어요' : '정답'} · <b>${esc(q.term)}</b></p>
          ${q.compare ? `<div class="comparison">${esc(q.compare)}</div>` : ''}
          <div class="row"><button class="btn" data-ext="wb-next">${quiz.index + 1 < quiz.order.length ? '다음 개념 →' : '결과 보기 →'}</button></div>`}
      </div></div>`, scroll);
    const input = document.querySelector('#wbAnswer');
    if (input) { input.focus({preventScroll:true}); input.setSelectionRange(input.value.length, input.value.length); }
  }
  function quizSubmit(){
    const q = quiz.order[quiz.index], input = document.querySelector('#wbAnswer');
    quiz.input = input ? input.value : '';
    const norm = window.RecallGame ? window.RecallGame.normalize : (v => String(v).replace(/\s+/g,''));
    if (!norm(quiz.input)) { quiz.message = '개념을 입력해 주세요.'; quizRender(false); return; }
    const info = WB.info(q.id);
    const ok = [q.term, ...((info && info.concept.aliases) || [])].some(a => norm(a) === norm(quiz.input));
    if (ok) { quiz.status = 'correct'; quiz.right++; WB.mark(q.id, true); }
    else if (!quiz.hinted) { quiz.hinted = true; quiz.message = '한 번 더 떠올려 보세요. 초성 힌트를 열었어요.'; }
    else { quiz.status = 'wrong'; quiz.wrong++; WB.mark(q.id, false); }
    quizRender(false);
  }
  function quizNext(){
    if (quiz.index + 1 >= quiz.order.length) { quizResult(); return; }
    quiz.index++; quiz.input = ''; quiz.hinted = false; quiz.status = 'pending'; quiz.message = '';
    quizRender();
  }
  function quizResult(){
    const total = quiz.order.length, right = quiz.right;
    const left = WB.all().filter(i => !i.mastered).length;
    setScreen('wb-result', `<div class="wrap screen">
      <span class="eyebrow">WORD BOOK · REVIEW</span><h1 class="tree-title">다시 학습을 마쳤어요.</h1>
      <div class="growth-totals"><div><b>${right} / ${total}</b><span>이번에 스스로 쓴 개념</span></div>
      <div><b>${left}</b><span>단어장에 남은 더 볼 개념</span></div></div>
      <div class="growth-note"><p>같은 개념을 두 번 맞히면 <b>익힘</b>으로 표시되고 다시 학습 목록에서 빠져요. 틀리면 다시 더 볼 개념으로 돌아와요.</p></div>
      <div class="row tree-actions"><button class="btn" data-ext="wb-quiz" ${left ? '' : 'disabled'}>남은 개념 더 하기 →</button>
      <button class="ghost" data-ext="wordbook">단어장 보기</button>
      <button class="ghost" data-ext="tree">개념 트리 하기</button></div></div>`);
    quiz = null;
  }

  // ---------- 라우터 ----------
  document.addEventListener('click', event => {
    const el = event.target.closest('[data-ext]'); if (!el || el.disabled) return;
    const action = el.dataset.ext;
    if (action.startsWith('tree')) { if (TG && TG.handle(action, el)) return; }
    switch (action) {
      case 'account': accountView(); break;
      case 'wordbook': wbUnit = ''; wordbookView(); break;
      case 'glossary-jump': closeModal(); glossary(); break;
      case 'wb-filter': wbUnit = el.dataset.id || ''; wordbookView(false); break;
      case 'wb-remove': WB.remove(el.dataset.id); wordbookView(false); break;
      case 'wb-again': WB.mark(el.dataset.id, false); wordbookView(false); break;
      case 'wb-clear':
        showModal('단어장을 비울까요?', '<p>담긴 개념을 모두 지웁니다. 다른 기록은 그대로 남습니다.</p><div class="row"><button class="btn" data-ext="wb-clear-confirm">비우기</button><button class="ghost" data-action="close-modal">취소</button></div>');
        break;
      case 'wb-clear-confirm': WB.clear(); closeModal(); wordbookView(); toast('단어장을 비웠습니다.'); break;
      case 'wb-quiz': quizStart(); break;
      case 'wb-submit': quizSubmit(); break;
      case 'wb-hint': quiz.hinted = true; quiz.message = '초성을 보고 개념을 떠올려 보세요.'; quizRender(false); break;
      case 'wb-reveal': quiz.status = 'wrong'; quiz.wrong++; WB.mark(quiz.order[quiz.index].id, false); quizRender(false); break;
      case 'wb-next': quizNext(); break;
      case 'code-new': gateHTML(gateMade(A.create(''))); break;
      case 'code-open-join': gateHTML(gateJoin('')); break;
      case 'code-back': gateHTML(gateStart()); break;
      case 'code-skip': A.stay(); closeGate(); refreshChrome(); toast('코드 없이 둘러보기로 시작합니다.'); break;
      case 'code-start': {
        const nick = document.querySelector('#codeNick'); A.rename(nick ? nick.value : '');
        location.reload(); break;
      }
      case 'code-join': {
        const input = document.querySelector('#codeInput');
        if (A.use(input ? input.value : '')) location.reload();
        else gateHTML(gateJoin('이 기기에 그 코드가 없어요. 숫자 8자리를 다시 확인해 주세요.'));
        break;
      }
      case 'code-new-inline':
        showModal('새 학습 코드를 만들까요?', `<p>새 코드를 만들면 지금 코드의 기록은 그대로 남고, 새 코드로 전환됩니다.</p><p class="small muted">${PRIVACY}</p><div class="row"><button class="btn" data-ext="code-new-confirm">만들기</button><button class="ghost" data-action="close-modal">취소</button></div>`);
        break;
      case 'code-new-confirm': A.create(''); location.reload(); break;
      case 'code-open-join-screen': {
        closeModal();
        const box = document.createElement('div');
        box.className = 'code-gate'; box.id = 'codeGate'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
        box.innerHTML = gateJoin(''); document.body.append(box); box.querySelector('input')?.focus();
        break;
      }
      case 'code-rename': { const n = document.querySelector('#nickInput'); A.rename(n ? n.value : ''); refreshChrome(); accountView(); toast('별명을 저장했습니다.'); break; }
      case 'code-switch': if (A.use(el.dataset.id)) location.reload(); break;
      case 'code-signout':
        showModal('코드 없이 이용할까요?', '<p>지금 코드의 기록은 이 기기에 그대로 남습니다. 나중에 코드를 다시 넣으면 이어서 쓸 수 있어요.</p><div class="row"><button class="btn" data-ext="code-signout-confirm">코드 없이 이용</button><button class="ghost" data-action="close-modal">취소</button></div>');
        break;
      case 'code-signout-confirm': A.signOut(); A.stay(); location.reload(); break;
      case 'code-forget': {
        const id = el.dataset.id;
        showModal('이 코드를 삭제할까요?', `<p><b>${A.pretty(id)}</b> 코드와 그 코드의 모든 학습 기록(단어장 포함)을 이 기기에서 지웁니다. 되돌릴 수 없습니다.</p><div class="row"><button class="btn warn" data-ext="code-forget-confirm" data-id="${id}">삭제</button><button class="ghost" data-action="close-modal">취소</button></div>`);
        break;
      }
      case 'code-forget-confirm': A.forget(el.dataset.id); location.reload(); break;
    }
  });
  document.addEventListener('keydown', event => {
    if (event.key !== 'Enter') return;
    const id = event.target.id;
    if (id === 'wbAnswer') { event.preventDefault(); quizSubmit(); }
    else if (id === 'codeInput') { event.preventDefault(); document.querySelector('[data-ext="code-join"]')?.click(); }
    else if (id === 'codeNick') { event.preventDefault(); document.querySelector('[data-ext="code-start"]')?.click(); }
  });

  // 화면이 바뀔 때마다 상단 메뉴와 화면 안의 카운터를 최신 값으로 맞춘다.
  const appNode = document.getElementById('app');
  if (appNode && window.MutationObserver) new MutationObserver(() => refreshChrome()).observe(appNode, {childList:true, subtree:false});

  buildNav(); gate(); refreshChrome();
})();

</script>
</body>
</html>
