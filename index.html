<script>
(() => {
  const manifest = document.getElementById('embedded-images');
  const images = JSON.parse(manifest.textContent);
  for (const [name, data] of Object.entries(images)) {
    // 그림은 img 폴더의 파일을 바로 쓴다(태블릿 메모리 부담 줄이기).
    if (!data.startsWith('data:')) { document.documentElement.style.setProperty(name, 'url("' + data + '")'); continue; }
    const comma = data.indexOf(',');
    const mime = data.slice(5, data.indexOf(';'));
    const binary = atob(data.slice(comma + 1));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const imageUrl = URL.createObjectURL(new Blob([bytes], {type: mime}));
    document.documentElement.style.setProperty(name, 'url("' + imageUrl + '")');
  }
  manifest.textContent = '';
})();
</script>

<script data-bundle-source="accounts.js">
'use strict';
/* 학습 코드(개인 계정) — 2026학번 형태의 코드를 게임이 직접 만들어 줍니다.
   실명·실제 학번·사진은 입력받지 않으며, 모든 기록은 이 기기의 브라우저에만 저장됩니다. */
(() => {
  const AKEY = 'youngpa-social-accounts-v1';
  const SCOPED = ['youngpa-social-archive-v1','youngpa-social-journey-v1','youngpa-social-recall-v1','youngpa-social-wordbook-v1','youngpa-social-tree-v1'];
  const YEAR = '2026';
  const read = () => { try { return JSON.parse(localStorage.getItem(AKEY) || 'null'); } catch { return null; } };
  const saved = read();
  let book = (saved && saved.version === 1 && Array.isArray(saved.list))
    ? {version:1, list:saved.list.filter(a => a && typeof a.id === 'string'), active: typeof saved.active === 'string' ? saved.active : null, guest: saved.guest === true}
    : {version:1, list:[], active:null, guest:false};
  if (book.active && !book.list.some(a => a.id === book.active)) book.active = null;
  let canStore = true;
  function persist(){ try { localStorage.setItem(AKEY, JSON.stringify(book)); canStore = true; } catch { canStore = false; } }

  // 활성 코드가 있으면 앱의 저장 키에 코드별 접두사를 붙여 기록을 분리한다.
  const nget = Storage.prototype.getItem, nset = Storage.prototype.setItem, ndel = Storage.prototype.removeItem;
  const mapKey = k => (book.active && SCOPED.includes(k)) ? `acc:${book.active}:${k}` : k;
  try {
    Storage.prototype.getItem = function(k){ return nget.call(this, this === window.localStorage ? mapKey(k) : k); };
    Storage.prototype.setItem = function(k,v){ return nset.call(this, this === window.localStorage ? mapKey(k) : k, v); };
    Storage.prototype.removeItem = function(k){ return ndel.call(this, this === window.localStorage ? mapKey(k) : k); };
  } catch { /* 저장소를 감쌀 수 없으면 공용 기록으로 동작한다. */ }

  function newId(){
    const taken = new Set(book.list.map(a => a.id));
    for (let i = 0; i < 400; i++) {
      const id = YEAR + String(Math.floor(Math.random()*9000)+1000);
      if (!taken.has(id)) return id;
    }
    return YEAR + String(Date.now()).slice(-4);
  }
  const pretty = id => (typeof id === 'string' && id.length === 8) ? id.slice(0,4) + '-' + id.slice(4) : String(id || '');
  const clean = v => String(v || '').replace(/[^0-9]/g,'').slice(0,8);
  const find = id => book.list.find(a => a.id === id) || null;

  window.Accounts = {
    scopedKeys: SCOPED.slice(),
    canStore: () => canStore,
    activeId: () => book.active,
    active: () => find(book.active),
    list: () => book.list.map(a => ({...a})),
    isGuest: () => !book.active,
    decided: () => !!book.active || book.guest === true,
    pretty,
    label(){ const a = find(book.active); return a ? (a.nick ? `${a.nick} · ${pretty(a.id)}` : pretty(a.id)) : '코드 없이 이용'; },
    create(nick){
      const id = newId();
      book.list.push({id, nick: String(nick || '').slice(0,12), createdAt: new Date().toISOString()});
      book.active = id; book.guest = false; persist();
      return id;
    },
    use(input){
      const id = clean(input);
      if (!find(id)) return null;
      book.active = id; book.guest = false; persist();
      return id;
    },
    stay(){ book.guest = true; persist(); },
    signOut(){ book.active = null; book.guest = false; persist(); },
    rename(nick){ const a = find(book.active); if (a) { a.nick = String(nick || '').slice(0,12); persist(); } },
    forget(id){
      const target = clean(id); if (!find(target)) return false;
      for (const k of SCOPED) { try { ndel.call(localStorage, `acc:${target}:${k}`); } catch {} }
      book.list = book.list.filter(a => a.id !== target);
      if (book.active === target) book.active = null;
      persist(); return true;
    }
  };
})();

</script>

<script data-bundle-source="journey.js">
'use strict';
(() => {
  const key = 'youngpa-social-journey-v1';
  const units = window.SOCIAL_UNITS || [];
  const questions = window.SOCIAL_RECALL || [];
  const unitIds = new Set(units.map(u => u.id));
  const questionIds = new Set(questions.map(q => q.id));
  const clean = (items, valid) => [...new Set((Array.isArray(items) ? items : []).filter(id => valid.has(id)))];
  const read = name => { try { return JSON.parse(localStorage.getItem(name) || 'null'); } catch { return null; } };
  const prior = read(key);
  const saved = prior?.version===1 ? prior : null;
  let history = {version:1, completedUnits:clean(saved?.completedUnits,unitIds), recalledIds:clean(saved?.recalledIds,questionIds)};
  let canStore = true;
  const listeners = [];
  const stages = [
    {name:'관찰하기', criterion:'처음 만나는 사회 개념 살펴보기', description:'주변의 사회 현상에 관심을 열어요.'},
    {name:'이해하기', criterion:'기본 개념 연결 3단원 완료', description:'새로운 개념의 뜻을 차근차근 익혀요.'},
    {name:'연결하기', criterion:'기본 개념 연결 6단원 완료', description:'서로 다른 개념과 사회 현상을 이어 봐요.'},
    {name:'설명하기', criterion:`기본 개념 연결 ${units.length}단원 완료`, description:'기억 속 핵심어를 꺼내 내 말로 설명해 봐요.'},
    {name:'넓혀가기', criterion:'서로 다른 키워드 48문항 정답', description:'배운 내용을 되짚으며 이해의 폭을 넓혀요.'}
  ];
  function get() {
    const basicCompleted=history.completedUnits.length, recalled=history.recalledIds.length;
    const unlocked=units.length>0 && basicCompleted===units.length;
    const level=unlocked ? (recalled>=48?5:4) : basicCompleted>=6?3:basicCompleted>=3?2:1;
    const target=level===1?3:level===2?6:level===3?units.length:level===4?48:questions.length;
    const value=level<4?basicCompleted:recalled;
    const goal=level<4?`기본 개념 연결 ${basicCompleted} / ${target}단원`: `서로 다른 키워드 ${recalled} / ${target}문항`;
    return {level,name:stages[level-1].name,basicCompleted,totalUnits:units.length,recalled,totalQuestions:questions.length,unlocked,target,value,goal,percent:Math.min(100,Math.round(value/Math.max(1,target)*100)),canStore};
  }
  function persist() {
    try {localStorage.setItem(key,JSON.stringify(history));canStore=true;} catch {canStore=false;}
    for(const fn of listeners)fn(get());
  }
  function syncBasics(records) {
    const next=clean([...history.completedUnits,...units.filter(u=>records?.[u.id]?.completed===true).map(u=>u.id)],unitIds);
    if(next.length!==history.completedUnits.length){history.completedUnits=next;persist();}
  }
  function recordRecall(id) {
    if(!get().unlocked || !questionIds.has(id) || history.recalledIds.includes(id))return;
    history.recalledIds.push(id);persist();
  }
  // Keep available achievements from earlier app versions, without inventing lost history.
  const base=read('youngpa-social-archive-v1');
  if(base?.version===1)syncBasics(base.units);
  const recall=read('youngpa-social-recall-v1');
  if(recall?.version===1){
    const answers=[...(Array.isArray(recall.lastResult?.answers)?recall.lastResult.answers:[]),...(Array.isArray(recall.session?.answers)?recall.session.answers:[])];
    history.recalledIds=clean([...history.recalledIds,...answers.filter(a=>a&&['independent','helped'].includes(a.outcome)).map(a=>a.id)],questionIds);
  }
  persist();
  window.CivicJourney={
    get, stages:stages.map(s=>({...s})), syncBasics, recordRecall,
    hasCompleted:id=>history.completedUnits.includes(id),
    canRecall:()=>get().unlocked,
    subscribe:fn=>listeners.push(fn),
    resetRecall(){history.recalledIds=[];persist();},
    resetAll(){history={version:1,completedUnits:[],recalledIds:[]};persist();}
  };
})();

</script>
<script data-bundle-source="game.js">
'use strict';
// Adapted from THE LAST GREEN DAY: chapter frames, dialogue portraits, touch
// boards, hints and replay. This edition keeps progress in its own browser store.
const $ = s => document.querySelector(s);
const app = $('#app');
const units = window.SOCIAL_UNITS || [];
const KEY = 'youngpa-social-archive-v1';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { const b = [...a]; for (let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const fresh = () => ({version:1,units:{},review:[],bookmarks:[],lastUnit:null,updatedAt:null});
let store = fresh(), storageOK = true, activeUnit = null, screen = 'home', bookFilter = 0;
let typed = '', typingTimer = null, dialogueIndex = 0, modalFocus = null, lastTick = Date.now(), toastTimer;
try {
  const raw=localStorage.getItem(KEY);
  if(raw){const d=JSON.parse(raw);if(d.version===1&&d.units&&typeof d.units==='object'&&Array.isArray(d.review)&&Array.isArray(d.bookmarks))store={...fresh(),...d};}
} catch { storageOK=false; }
function save(){
  store.updatedAt=new Date().toISOString();
  try { localStorage.setItem(KEY,JSON.stringify(store)); storageOK=true; } catch { storageOK=false; }
  if(!storageOK){$('#storageNotice').classList.remove('hide');$('#storageNotice').textContent='이 브라우저에서는 기록을 저장할 수 없습니다. 창을 닫으면 진행 내용이 사라질 수 있어요.';}
  else $('#storageNotice').classList.add('hide');
  window.CivicJourney.syncBasics(store.units);
}
function announce(s){$('#announcer').textContent=s;}
function toast(s){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=s;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),2600);}
const uById=id=>units.find(u=>u.id===id);
function progress(u){
  const d=store.units[u.id];
  if(!d||!Number.isInteger(d.round)||d.round<0||d.round>rounds(u).length||!['dialogue','puzzle','done'].includes(d.phase)){
    store.units[u.id]={round:0,phase:'dialogue',line:0,wrong:0,hints:0,elapsed:0,roundState:null,completed:false,challengeReview:false};
  }
  return store.units[u.id];
}
const completed=()=>window.CivicJourney.get().basicCompleted;
const totalConcepts=()=>units.reduce((n,u)=>n+u.concepts.length,0);
const fmt=s=>Math.floor((s||0)/60)+'분 '+String(Math.floor((s||0)%60)).padStart(2,'0')+'초';
function tick(){
  const now=Date.now(),delta=Math.max(0,Math.min(2,(now-lastTick)/1000));lastTick=now;
  if(screen==='puzzle'&&activeUnit&&!document.hidden&&$('#modal').classList.contains('hide')&&!progress(activeUnit).roundState?.passed){const p=progress(activeUnit);p.elapsed=(p.elapsed||0)+delta;const c=$('#clock');if(c)c.textContent=fmt(p.elapsed);}
}
const ref=(u,p)=>`사회${u.book===1?'①':'②'} · ${u.number}단원 · ${p}쪽`;
function rounds(u){
  const r=[];for(let i=0;i<u.concepts.length;i+=4)r.push({type:'match',concepts:u.concepts.slice(i,i+4),prompt:'용어와 뜻이 맞는 기록을 연결하세요.'});
  return r.concat(u.challenges);
}
function setScreen(name,html,scroll=true){clearInterval(typingTimer);screen=name;app.innerHTML=html;updateGrowthUI();if(scroll){window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true});}lastTick=Date.now();}
function closeModal(){const wasOpen=!$('#modal').classList.contains('hide');$('#modal').classList.add('hide');$('#modalBody').innerHTML='';document.body.style.overflow='';if(wasOpen)modalFocus?.focus?.();lastTick=Date.now();}
function showModal(title,html){
  if($('#modal').classList.contains('hide'))modalFocus=document.activeElement;
  $('#modalBody').innerHTML=`<div class="modal-title-row"><h2 id="modalTitle">${esc(title)}</h2><button data-action="close-modal" aria-label="닫기">×</button></div>${html}`;
  $('#modal').classList.remove('hide');document.body.style.overflow='hidden';$('#modalBody button').focus();lastTick=Date.now();
}
function growthPanel(){
  const g=window.CivicJourney.get();
  const next=g.level<5?`다음 성장: ${window.CivicJourney.stages[g.level].name}`:g.recalled===g.totalQuestions?'모든 키워드를 되짚었어요. 배움을 일상으로 이어 가요.':`${g.totalQuestions}개 키워드로 배움을 계속 넓혀 가요.`;
  return `<section class="growth-panel" aria-label="민주시민 성장 기록"><div class="growth-emblem" aria-hidden="true"><small>성장</small><b>${g.level}</b></div><div class="growth-copy"><span class="eyebrow">민주시민 성장 레벨</span><h2>Lv.${g.level} · ${g.name}</h2><p>${next}</p><div class="growth-track" role="progressbar" aria-label="성장 목표 진행" aria-valuenow="${Math.min(g.value,g.target)}" aria-valuemin="0" aria-valuemax="${g.target}"><i style="width:${g.percent}%"></i></div><small>${g.goal}</small></div><button class="ghost" data-action="growth">나의 성장 보기 →</button></section>`;
}
function updateGrowthUI(){
  const g=window.CivicJourney.get();
  document.querySelectorAll('[data-growth-level]').forEach(el=>el.textContent=`Lv.${g.level}`);
  document.querySelectorAll('[data-action="recall"]').forEach(el=>{
    el.dataset.keywordLocked=String(!g.unlocked);
    if(g.unlocked)el.removeAttribute('aria-label');
    else el.setAttribute('aria-label',`키워드 게임 · 잠금 안내 (${g.basicCompleted}/${g.totalUnits}단원 완료)`);
    el.classList.toggle('is-locked',!g.unlocked);
    el.title=g.unlocked?'핵심어를 직접 떠올리는 키워드 게임':`기본 개념 연결 ${g.basicCompleted}/${g.totalUnits}단원 완료 · 모두 마치면 열려요`;
  });
  document.querySelectorAll('[data-keyword-lock]').forEach(el=>el.hidden=g.unlocked);
  document.querySelectorAll('[data-growth-summary]').forEach(el=>el.innerHTML=growthPanel());
}
function growthView(){

  const p=progress(activeUnit),r=rounds(activeUnit)[p.round],s=roundState();if(s.passed)return;let valid=false;
  if(r.type==='choice'){if(!s.selected){s.notice='설명을 하나 선택해 주세요.';renderPuzzle(false);return;}valid=s.selected===r.answer;}
  if(r.type==='sort'){if(r.items.some((_,i)=>!s.answers[i])){s.notice='모든 기록을 먼저 분류해 주세요.';renderPuzzle(false);return;}s.wrongItems=r.items.map((it,i)=>s.answers[i]===it.answer?-1:i).filter(i=>i>=0);valid=!s.wrongItems.length;}
  if(r.type==='order')valid=s.order.join('|')===r.answer.join('|');
  if(valid){s.passed=true;s.notice='복원 성공! 해설과 교과서 근거를 확인하세요.';}
  else{p.wrong++;p.challengeReview=true;s.notice=r.type==='sort'?'‘다시 확인’ 표시가 있는 기록의 기준을 살펴보세요.':'아직 연결되지 않은 부분이 있어요. 힌트나 개념 도감에서 근거를 확인해 보세요.';}
  save();renderPuzzle(false);announce(s.notice);
}
function hint(){
  const p=progress(activeUnit),r=rounds(activeUnit)[p.round],s=roundState();if(s.passed)return;
  if(!s.hinted){s.hinted=true;p.hints++;save();}
  const h=r.type==='match'?`용어와 설명에서 공통으로 가리키는 대상을 찾아보세요. ${r.concepts.filter(c=>!s.matched.includes(c.id)).map(c=>`${c.term}: ${c.compare||'교과서 '+c.page+'쪽에서 뜻을 확인하세요.'}`).join(' / ')}`:r.hint;
  showModal('생각의 실마리',`<p>${esc(h)}</p><p class="small muted">같은 미션의 힌트는 한 번만 기록합니다.</p><button class="btn" data-action="close-modal">다시 생각해 보기</button>`);
}
function nextRound(){const p=progress(activeUnit);if(!roundState().passed)return;p.round++;p.roundState=null;save();if(p.round>=rounds(activeUnit).length)finishUnit();else renderPuzzle();}
function finishUnit(){const p=progress(activeUnit);p.completed=true;p.phase='done';p.round=rounds(activeUnit).length;p.roundState=null;p.completedAt=new Date().toISOString();save();unitResult();}
function unitResult(){

  setScreen('unit-result',frame(`<div class="missionhead"><span class="eyebrow">ARCHIVE RESTORED</span><h2>${esc(activeUnit.title)} · 복원 완료</h2><p>용어의 뜻과 연결 관계를 되짚으며 이 단원을 정리했습니다.</p></div><div class="record-grid"><div class="record-stat"><strong>${activeUnit.concepts.length}</strong><span>연결한 개념</span></div><div class="record-stat"><strong>${p.wrong}</strong><span>다시 시도한 횟수</span></div><div class="record-stat"><strong>${p.hints}</strong><span>힌트 사용</span></div></div><div class="panel"><h3>내 말로 설명해 볼까요?</h3><p>${esc(activeUnit.subtitle)} 아래 개념의 뜻을 가리고 한 문장씩 설명해 보세요.</p><div class="row"><button class="btn" data-action="unit-concepts">단원 개념 한눈에 보기</button><button class="ghost" data-action="unit-glossary" data-id="${activeUnit.id}">도감에서 다시 보기</button></div>${review.length?`<div class="info"><b>다시 볼 개념 ${review.length}개</b><br>${review.map(c=>esc(c.term)).join(' · ')}</div>`:'<p class="small muted">필요한 개념은 도감에서 ‘다시 보기’로 표시할 수 있습니다.</p>'}</div><div data-growth-summary>${growthPanel()}</div>${completed()===units.length?'<div class="keyword-unlocked"><h3>키워드 게임이 열렸어요!</h3><p>모든 단원의 기본 개념 연결을 마쳤어요. 이제 핵심어를 직접 떠올려 보세요.</p><button class="btn" data-action="recall">키워드 게임 시작 →</button></div>':''}<div class="row"><button class="btn" data-action="board">다른 기록실로 →</button><button class="ghost" data-action="restart" data-id="${activeUnit.id}">이 단원 다시 도전</button>${completed()===units.length?'<button class="btn secondary" data-action="ending">전체 복원 엔딩 →</button>':''}</div><p class="small muted">완료 표시는 미션을 마쳤다는 뜻입니다. 점수나 성취도를 판정하는 평가 결과는 아닙니다.</p>`));
}
function conceptCard(u,c){const marked=store.bookmarks.includes(c.id),review=store.review.includes(c.id);return `<article class="concept-card"><div class="concept-meta"><span>${ref(u,c.page)}</span><span>${review?'다시 볼 개념':''}</span></div><h3>${esc(c.term)}</h3><p>${esc(c.definition)}</p>${c.compare?`<div class="comparison">${esc(c.compare)}</div>`:''}<button class="bookmark ${marked?'active':''}" data-action="bookmark" data-id="${c.id}" aria-pressed="${marked}">${marked?'★ 표시 해제':'☆ 다시 보기 표시'}</button>${review?`<button class="bookmark" data-action="review-clear" data-id="${c.id}">이제 알겠어요 ✓</button>`:''}</article>`;}
function unitConcepts(){if(!activeUnit)return;showModal(activeUnit.title,`<p class="small muted">${activeUnit.concepts.length}개 개념 · 인쇄된 교과서 ${esc(activeUnit.pageRange)}쪽</p><div class="concept-list">${activeUnit.concepts.map(c=>conceptCard(activeUnit,c)).join('')}</div>`);}
let glossaryUnit='',glossaryQuery='',glossaryReview=false;
function glossary(unitId='',review=false){
  activeUnit=null;glossaryUnit=unitId;glossaryReview=review;glossaryQuery='';
  setScreen('glossary',`<div class="wrap"><div class="section-heading"><div><span class="eyebrow">YOUR CONCEPT COLLECTION</span><h1>개념 도감</h1><p class="muted">용어의 뜻 · 헷갈리는 개념 비교 · 교과서 쪽수를 함께 확인하세요.</p></div><button class="ghost no-print" data-action="print">인쇄</button></div><div class="glossary-tools"><input id="conceptSearch" type="search" placeholder="용어 또는 설명 검색" aria-label="개념 검색"><select id="unitSelect" aria-label="단원 선택"><option value="">전체 단원</option>${units.map(u=>`<option value="${u.id}" ${u.id===unitId?'selected':''}>사회${u.book} ${u.number}. ${esc(u.title)}</option>`).join('')}</select><label><input id="reviewOnly" type="checkbox" ${review?'checked':''}>다시 볼 개념만</label></div><p id="conceptCount" class="small muted"></p><div id="conceptResults"></div><div class="chapter-foot"><div class="row"><button class="ghost" data-action="export-concepts">전체 개념표 CSV 저장</button><button class="ghost" data-action="board">기록실로 돌아가기</button></div><p>쪽수는 PDF 파일의 순번이 아닌 교과서 인쇄 쪽수입니다.</p></div></div>`);

function updateGlossary(){
  const q=glossaryQuery.trim().toLocaleLowerCase(),reviewSet=new Set([...store.review,...store.bookmarks]);let count=0;
  const html=units.filter(u=>!glossaryUnit||u.id===glossaryUnit).map(u=>{const cs=u.concepts.filter(c=>(!q||(c.term+' '+c.definition+' '+c.compare).toLocaleLowerCase().includes(q))&&(!glossaryReview||reviewSet.has(c.id)));count+=cs.length;return cs.length?`<h2 class="chapter-label">사회${u.book===1?'①':'②'} ${u.number}. ${esc(u.title)}</h2><div class="concept-list">${cs.map(c=>conceptCard(u,c)).join('')}</div>`:'';}).join('');
  $('#conceptCount').textContent=`${count}개의 개념`;
  $('#conceptResults').innerHTML=html||'<div class="empty-state">조건에 맞는 개념이 없습니다. 검색어나 단원, 다시 보기 조건을 바꿔 보세요.</div>';
}
function guide(){showModal('게임과 수업 안내',`<h3>01 · 개념 먼저 살펴보기</h3><p>개념 도감에서 용어의 뜻, 헷갈리는 개념, 교과서 쪽수를 살펴봅니다. 언제든 자유롭게 볼 수 있습니다.</p><h3>02 · 기본 개념 연결</h3><p>단원별로 용어와 뜻을 연결하고 적용 미션을 풉니다. ${units.length}개 단원의 개념 연결과 적용 미션을 모두 완료하면 키워드 게임이 열립니다. 이미 저장된 완료 기록도 인정합니다.</p><h3>03 · 키워드 게임</h3><p>문장의 빈칸에 들어갈 핵심어를 직접 씁니다. 초성 보기 버튼을 누르거나 첫 오답을 제출하면 초성이 열립니다. 띄어쓰기는 채점에 영향을 주지 않습니다.</p><p>기억 연습은 시간 제한이 없으며, 스피드 도전은 1·2·3분 중 고릅니다. 스피드 도전의 시간은 다른 화면이나 탭에서도 계속 흐릅니다. 힌트나 정답을 확인한 문제는 다시 연습할 수 있습니다.</p><h3>민주시민 성장 레벨</h3><p>관찰하기 → 이해하기 → 연결하기 → 설명하기 → 넓혀가기. 기본 개념 연결 3·6·${units.length}단원 완료와 서로 다른 키워드 48문항 정답을 기준으로 나의 학습 성장을 기록합니다. 초성 도움을 받아 맞힌 답도 포함하며, 같은 문항은 한 번만 기록합니다. 복습하거나 틀려도 쌓은 성장은 유지됩니다.</p><p><b>자동 저장:</b> 기록은 현재 기기의 브라우저에 저장되며 다른 기기나 교사에게 전송되지 않습니다. 전체 학습 기록을 초기화하면 키워드 게임이 다시 잠깁니다. 키워드 기록만 초기화하면 기본 개념 연결 완료 기록은 유지됩니다.</p><h3>04 · 개념 트리</h3><p>연관 있는 개념을 하나로 묶고, 상위 개념과 하위 개념을 연결합니다. ‘개념 묶기’는 상위 개념에 들어갈 하위 개념을 모두 고르고, ‘상위·하위 연결’은 카드를 알맞은 상위 개념 아래로 옮깁니다. 틀린 개념은 단어장에 담깁니다.</p><h3>내 단어장</h3><p>키워드 게임·개념 트리·개념 연결에서 막힌 개념이 자동으로 담깁니다. 개념 도감의 ☆ 표시로 직접 담을 수도 있습니다. 단어장에서 ‘다시 학습’을 하면 뜻을 보고 개념을 쓰는 연습을 하고, 같은 개념을 두 번 맞히면 ‘익힘’으로 표시됩니다.</p><h3>학습 코드</h3><p>게임이 2026으로 시작하는 8자리 숫자 코드를 만들어 줍니다. 코드마다 기록과 단어장이 따로 저장되고, 같은 기기에서 코드를 다시 넣으면 이어서 쓸 수 있습니다. 실명·실제 학번·사진은 입력하지 않으며, 코드와 기록은 이 기기의 브라우저에만 저장됩니다.</p><div class="source-note"><b>학습 근거</b><p>선생님이 제공한 비상교육 사회① 교사용 교과서와 사회②(최성길) 교과서의 지정 ${units.length}개 단원입니다. 설명과 문제 문장은 복습용으로 재구성했습니다. 게임의 기록실 이야기는 가상 설정입니다.</p><p>교과서의 과거 통계, 현행 여부 확인이 필요한 법률의 수치, 교사용 주석은 학생용 문제에 사용하지 않았습니다.</p><p><a href="https://ebook.vivasam.com/v2/textbookviewer/viewer.jsp?contentId=/dvd/2015/20200302/M0SO0601_2018/data/ebook.pdf" target="_blank" rel="noopener noreferrer">사회① 공식 e-book ↗</a> · <a href="https://ebook.vivasam.com/v2/textbookviewer/viewer.jsp?contentId=/dvd/2015/20200302/M0SO0602_2018/data/ebook.pdf" target="_blank" rel="noopener noreferrer">사회② 공식 e-book ↗</a></p></div>`);}

}
function downloadCSV(name,rows){const text='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function exportConcepts(){downloadCSV('사회_개념정리.csv',[['교과서','단원','단원명','개념','뜻','비교와 주의','교과서 쪽수'],...units.flatMap(u=>u.concepts.map(c=>['사회'+u.book,u.number,u.title,c.term,c.definition,c.compare,c.page]))]);}
function exportRecords(){downloadCSV('사회_개념복원_학습기록.csv',[['교과서','단원','단원명','진행','개념 수','다시 시도','힌트','풀이 초','완료 시각'],...units.map(u=>{const p=store.units[u.id];return ['사회'+u.book,u.number,u.title,p?.completed?'완료':p?'진행 중':'시작 전',u.concepts.length,p?.wrong||0,p?.hints||0,Math.floor(p?.elapsed||0),p?.completedAt||''];})]);}
function refreshConceptUI(){if(!$('#modal').classList.contains('hide')&&activeUnit)unitConcepts();else if(screen==='glossary')updateGlossary();}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b||b.disabled)return;
  tick();
  const a=b.dataset.action,id=b.dataset.id;
  if(a==='close-modal'){closeModal();return;}
  if(['home','board','glossary','unit-glossary','review','unit','ending','recall','growth'].includes(a))closeModal();
  if(a==='home')home();
  else if(a==='recall'){if(window.CivicJourney.canRecall())window.RecallGame?.open();else showKeywordGate();}
  else if(a==='growth')growthView();
  else if(a==='board'){save();board();}
  else if(a==='filter'){bookFilter=Number(b.dataset.value);board();}
  else if(a==='unit')openUnit(id);
  else if(a==='glossary')glossary();
  else if(a==='unit-glossary')glossary(id);
  else if(a==='review')glossary('',true);
  else if(a==='guide')guide();
  else if(a==='records')records();
  else if(a==='unit-concepts')unitConcepts();
  else if(a==='next-line')nextLine();
  else if(a==='prev-line'){dialogueIndex=Math.max(0,dialogueIndex-1);showDialogue();}
  else if(a==='match-term')matchTerm(id);
  else if(a==='match-def')matchDefinition(id);
  else if(a==='hint')hint();
  else if(a==='next-round')nextRound();
  else if(a==='check')check();
  else if(a==='sort-item'){const s=roundState();s.selected=Number(b.dataset.index);save();renderPuzzle(false);}
  else if(a==='sort-category'){const s=roundState();if(s.selected===null)return;s.answers[s.selected]=id;s.selected=null;s.notice='분류했습니다. 모든 기록을 담은 뒤 확인하세요.';s.wrongItems=[];save();renderPuzzle(false);}
  else if(a==='choose'){const s=roundState();s.selected=id;s.notice='';save();renderPuzzle(false);}
  else if(a==='move'){const s=roundState(),i=Number(b.dataset.index),j=i+Number(b.dataset.delta);if(j<0||j>=s.order.length)return;[s.order[i],s.order[j]]=[s.order[j],s.order[i]];s.notice='';save();renderPuzzle(false);}
  else if(a==='bookmark'){const on=!store.bookmarks.includes(id);store.bookmarks=on?[...store.bookmarks,id]:store.bookmarks.filter(x=>x!==id);if(on)window.Wordbook?.add(id,'개념 도감에서 담음');else window.Wordbook?.remove(id);save();refreshConceptUI();}
  else if(a==='review-clear'){store.review=store.review.filter(x=>x!==id);save();refreshConceptUI();}
  else if(a==='restart'){showModal('이 단원을 다시 도전할까요?',`<p>이 단원의 풀이 기록이 새로 시작됩니다. 이미 완료한 단원의 성장 기록과 키워드 게임 열림 상태는 유지됩니다.</p><div class="row"><button class="btn" data-action="restart-confirm" data-id="${id}">다시 시작</button><button class="ghost" data-action="close-modal">취소</button></div>`);}
  else if(a==='restart-confirm'){delete store.units[id];save();closeModal();openUnit(id);}
  else if(a==='reset-confirm')showModal('기록을 초기화할까요?','<p>기본 개념 연결, 키워드 게임, 민주시민 성장 기록을 모두 초기화합니다. 키워드 게임은 다시 모든 단원을 완료해야 열립니다. 필요하면 먼저 기록 CSV를 저장해 주세요.</p><div class="row"><button class="btn" data-action="reset-all">모두 초기화</button><button class="ghost" data-action="close-modal">취소</button></div>');
  else if(a==='reset-all'){store=fresh();window.RecallGame?.resetForJourney();window.CivicJourney.resetAll();save();closeModal();home();toast('이 브라우저의 기록을 초기화했습니다.');}
  else if(a==='export-concepts')exportConcepts();
  else if(a==='export-records')exportRecords();
  else if(a==='print')window.print();
  else if(a==='ending')ending();
  else if(a==='fullscreen'){Promise.resolve(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()).catch(()=>toast('이 브라우저에서는 전체화면을 열 수 없습니다.'));}
});
document.addEventListener('input',e=>{if(e.target.id==='conceptSearch'){glossaryQuery=e.target.value;updateGlossary();}});
document.addEventListener('change',e=>{if(e.target.id==='unitSelect'){glossaryUnit=e.target.value;updateGlossary();}if(e.target.id==='reviewOnly'){glossaryReview=e.target.checked;updateGlossary();}});
document.addEventListener('keydown',e=>{

  if(e.key==='Tab'){const items=[...$('#modalBody').querySelectorAll('button:not(:disabled),a[href],input,select,[tabindex="0"]')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal();});
document.addEventListener('visibilitychange',()=>{lastTick=Date.now();if(document.hidden)save();});
window.addEventListener('pagehide',()=>{tick();save();});
setInterval(tick,1000);
setInterval(()=>{if(screen==='puzzle')save();},10000);
window.CivicJourney.showGate=showKeywordGate;
window.CivicJourney.summaryHTML=growthPanel;
let previousGrowthLevel=window.CivicJourney.get().level;
window.CivicJourney.subscribe(g=>{

  previousGrowthLevel=g.level;
});
if(!units.length){setScreen('error','<div class="wrap"><h1>개념 자료를 불러오지 못했습니다.</h1><p>페이지를 새로고침해 주세요.</p></div>');}
else {save();home();}

</script>
<script data-bundle-source="recall.js">
'use strict';
(() => {
  const questions = window.SOCIAL_RECALL || [];
  const byId = new Map(questions.map(q => [q.id, q]));
  const unitMap = new Map(window.SOCIAL_UNITS.map(u => [u.id, u]));
  const key = 'youngpa-social-recall-v1';
  const initialLetters = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const normalize = value => String(value).normalize('NFC').replace(/\s+/g, '').replace(/[.。!?]/g, '').toLowerCase();
  const initials = value => [...value.normalize('NFC')].map(ch => {
    const n = ch.charCodeAt(0) - 0xac00;
    return n >= 0 && n < 11172 ? initialLetters[Math.floor(n / 588)] : ch;
  }).join('');
  const defaultState = () => ({version: 1, settings: {mode: 'practice', selected: [...unitMap.keys()], count: 12, duration: 120}, session: null, lastResult: null, weak: []});
  let data = defaultState(), canStore = true, composing = false, lastImeCommit = 0, lastPulse = Date.now(), lastSave = 0;
  try {
    const loaded = JSON.parse(localStorage.getItem(key) || 'null');
    if (loaded?.version === 1) {
      const settings = loaded.settings || {};
      data.settings = {
        mode: settings.mode === 'speed' ? 'speed' : 'practice',
        selected: Array.isArray(settings.selected) ? settings.selected.filter(id => unitMap.has(id)) : [...unitMap.keys()],
        count: [12, 24, 0].includes(settings.count) ? settings.count : 12,
        duration: [60, 120, 180].includes(settings.duration) ? settings.duration : 120
      };
      data.weak = Array.isArray(loaded.weak) ? [...new Set(loaded.weak.filter(id => byId.has(id)))] : [];
      const s = loaded.session;
      if (s && ['practice', 'speed'].includes(s.mode) && Array.isArray(s.qids) && s.qids.length && s.qids.every(id => byId.has(id)) && new Set(s.qids).size === s.qids.length && Number.isInteger(s.index) && s.index >= 0 && s.index < s.qids.length && Array.isArray(s.answers) && s.answers.length === s.index && s.current && ['pending','correct','revealed'].includes(s.current.status) && Number.isFinite(s.elapsedMs) && (s.mode !== 'speed' || Number.isFinite(s.deadlineMs))) {
        // A resolved current question is already in answers, unlike a pending one.
        data.session = s;
      } else if (s && Array.isArray(s.qids) && s.qids.every(id => byId.has(id)) && Array.isArray(s.answers) && Number.isInteger(s.index) && s.index >= 0 && s.index < s.qids.length && s.answers.length === s.index + 1 && ['correct','revealed'].includes(s.current?.status) && Number.isFinite(s.elapsedMs) && ['practice','speed'].includes(s.mode) && (s.mode !== 'speed' || Number.isFinite(s.deadlineMs))) data.session = s;
      const r = loaded.lastResult;
      if (r && Array.isArray(r.answers) && r.answers.every(a => byId.has(a.id)) && Array.isArray(r.qids) && r.qids.every(id => byId.has(id))) data.lastResult = r;
    }
  } catch { /* An unreadable record must never prevent a new round. */ }

  function persist() {
    try { localStorage.setItem(key, JSON.stringify(data)); canStore = true; }
    catch { canStore = false; }
    const node = document.querySelector('#recallStorage');
    if (node) node.textContent = canStore ? '이 브라우저에 자동 저장됩니다.' : '저장할 수 없는 브라우저입니다. 현재 창에서만 기록이 유지됩니다.';
  }
  function clock(ms) { const sec = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }
  function currentQuestion() { return byId.get(data.session.qids[data.session.index]); }
  function source(q) { const u = unitMap.get(q.unitId); return `사회${u.book === 1 ? '①' : '②'} · ${u.number}단원 · ${q.page}쪽`; }
  function sentence(q, complete = false) { return `${esc(q.before)}<span class="recall-blank ${complete ? 'filled' : ''}" aria-label="${complete ? esc(q.answer) : '빈칸'}">${complete ? esc(q.answer) : '　?　'}</span>${esc(q.after)}`; }
  function candidateIds() { return questions.filter(q => data.settings.selected.includes(q.unitId)).map(q => q.id); }
  function stats(answers) { return {independent: answers.filter(a => a.outcome === 'independent').length, helped: answers.filter(a => a.outcome === 'helped').length, unresolved: answers.filter(a => ['revealed','unanswered'].includes(a.outcome)).length}; }
  function resetCurrent() { return {input: '', attempts: 0, hinted: false, status: 'pending', message: ''}; }

  function ensureAccess(){if(window.CivicJourney.canRecall())return true;window.CivicJourney.showGate();return false;}
  function open() {
    if(!ensureAccess())return;
    pulse(); closeModal(); activeUnit = null;
    if (data.session?.mode === 'speed' && Date.now() >= data.session.deadlineMs) finish('timeout', false);
    renderSetup();
  }
  function renderSetup(scroll = true) {
    if(!ensureAccess())return;
    const settings = data.settings, pool = candidateIds(), size = settings.count ? Math.min(settings.count, pool.length) : pool.length;
    setScreen('recall-setup', `<div class="wrap recall-wrap">
      <div class="recall-heading"><div><span class="eyebrow">STEP 03 · KEYWORD RECALL</span><h1>이번엔, 직접 떠올려 볼까?</h1><p class="muted">보기 없이 핵심어를 쓰고, 막히면 초성으로 기억을 꺼내 보세요.</p></div><span class="recall-count">${window.SOCIAL_UNITS.length}개 단원 <b>${questions.length}</b>문항</span></div>
      <div class="recall-setup-grid"><section class="recall-settings">
        <h2 class="recall-label"><b>01</b> 도전 방법</h2>
        <div class="recall-modes" role="group" aria-label="도전 방법">
          <button data-recall="mode" data-value="practice" class="recall-mode ${settings.mode === 'practice' ? 'selected' : ''}" aria-pressed="${settings.mode === 'practice'}"><span>기억 연습</span><small>시간 제한 없이, 정확하게 떠올리기</small></button>
          <button data-recall="mode" data-value="speed" class="recall-mode ${settings.mode === 'speed' ? 'selected' : ''}" aria-pressed="${settings.mode === 'speed'}"><span>스피드 도전</span><small>제한 시간 안에, 빠르게 떠올리기</small></button>
        </div>
        <div class="recall-options"><label>문제 수<select id="recallCount"><option value="12" ${settings.count===12?'selected':''}>12문항</option><option value="24" ${settings.count===24?'selected':''}>24문항</option><option value="0" ${settings.count===0?'selected':''}>선택 범위 전체</option></select></label>${settings.mode==='speed'?`<label>제한 시간<select id="recallDuration">${[60,120,180].map(n=>`<option value="${n}" ${settings.duration===n?'selected':''}>${n/60}분</option>`).join('')}</select></label>`:'<p class="small muted">첫 오답에는 초성이 나타납니다.<br>띄어쓰기는 채점에 영향을 주지 않아요.</p>'}</div>
        <div class="recall-scope-heading"><h2 class="recall-label"><b>02</b> 단원 고르기</h2><span class="small muted">${settings.selected.length}개 선택</span></div>
        <div class="recall-shortcuts" role="group" aria-label="단원 빠른 선택">${[['all','전체'],['1','사회①'],['2','사회②'],['none','선택 해제']].map(([id,label])=>`<button class="ghost small" data-recall="scope" data-value="${id}">${label}</button>`).join('')}</div>
        <div class="recall-units">${window.SOCIAL_UNITS.map(u=>`<label class="recall-unit ${settings.selected.includes(u.id)?'selected':''}"><input type="checkbox" data-recall-unit="${u.id}" ${settings.selected.includes(u.id)?'checked':''}><span><small>사회${u.book===1?'①':'②'} · ${u.number}단원</small><b>${esc(u.title)}</b></span><em>12문항</em></label>`).join('')}</div>
        <div class="recall-startbar"><p>${pool.length ? `선택한 ${pool.length}문항 중 <b>${size}문항</b>을 무작위로 출제합니다.` : '연습할 단원을 하나 이상 골라 주세요.'}</p><button class="btn" data-recall="start" ${pool.length?'':'disabled'}>${settings.mode==='speed'?'스피드 도전':'기억 연습'} 시작 →</button></div>
      </section><aside class="recall-side">
        <div class="recall-sample"><span class="eyebrow">이렇게 풀어요</span><h2>민주주의</h2><p class="recall-example">나라의 주인은 <span class="recall-blank">　?　</span>이다.</p><div class="recall-sample-hint"><small>생각이 막힐 때</small><b>ㄱㅁ</b></div><p class="small muted">‘국민’을 입력하면 정답.<br>정답을 본 뒤에는 문장을 소리 내어 설명해 보세요.</p></div>
        <div class="recall-tips"><h3>기억을 꺼내는 세 단계</h3><ol><li>핵심어를 먼저 스스로 떠올리기</li><li>막히면 ‘초성 보기’ 누르기</li><li>정답·근거를 확인하고 다시 연습하기</li></ol><p class="small muted">${settings.mode==='speed'?'스피드 도전의 시간은 다른 화면이나 탭으로 이동해도 계속 흐릅니다.':'연습 시간은 이 화면에서 문제를 생각하는 동안만 기록합니다.'}</p></div>
        ${data.session?`<button class="ghost recall-full" data-recall="resume">지난 ${data.session.mode==='speed'?'스피드 도전':'기억 연습'} 이어하기 →</button>`:''}
        ${data.lastResult?'<button class="ghost recall-full" data-recall="last-result">지난 결과 보기</button>':''}
        <button class="ghost recall-full" data-recall="weak" ${data.weak.length?'':'disabled'}>다시 볼 핵심어 ${data.weak.length}문항 연습</button>
        <p id="recallStorage" class="small muted">${canStore?'이 브라우저에 자동 저장됩니다.':'현재 창에서만 기록이 유지됩니다.'}</p>
        <button class="recall-text-button" data-recall="reset">키워드 게임 기록 초기화</button>
      </aside></div></div>`, scroll);
  }
  function start(ids, mode = data.settings.mode, all = false) {
    if(!ensureAccess())return;
    const qids = shuffle([...new Set(ids)].filter(id=>byId.has(id)));
    if (!qids.length) return;
    const limit = all ? qids.length : data.settings.count || qids.length;
    data.session = {mode, qids: qids.slice(0, limit), index: 0, answers: [], current: resetCurrent(), elapsedMs: 0, startedAt: Date.now(), deadlineMs: mode==='speed'?Date.now()+data.settings.duration*1000:null, duration: data.settings.duration};
    lastPulse=Date.now();persist();renderQuestion();
  }
  function begin() {
    if(!ensureAccess())return;
    if (data.session) { showModal('새 연습을 시작할까요?', '<p>진행 중인 키워드 게임을 마치고 새 문제를 시작합니다. 이미 모아 둔 ‘다시 볼 핵심어’는 유지됩니다.</p><div class="row"><button class="btn" data-recall="replace-session">새로 시작</button><button class="ghost" data-action="close-modal">취소</button></div>');return; }
    start(candidateIds());
  }
  function renderQuestion(scroll=true) {
    if(!ensureAccess())return;
    const s=data.session;if(!s)return renderResult(data.lastResult);
    if(s.mode==='speed'&&Date.now()>=s.deadlineMs){finish('timeout');return;}
    const q=currentQuestion(),u=unitMap.get(q.unitId),c=s.current,st=stats(s.answers),done=c.status!=='pending';
    setScreen('recall-play',`<div class="wrap recall-wrap recall-play">
      <div class="recall-play-top"><div><span class="eyebrow">${s.mode==='speed'?'SPEED CHALLENGE':'RECALL PRACTICE'}</span><p class="small muted">사회${u.book===1?'①':'②'} ${u.number}단원 · ${esc(u.title)}</p></div><button class="ghost small" data-recall="exit">${s.mode==='speed'?'도전 마치기':'저장하고 나가기'}</button></div>
      <div class="recall-meter"><span>QUESTION <b>${String(s.index+1).padStart(2,'0')}</b> / ${s.qids.length}</span><div class="recall-meter-track" aria-hidden="true"><i style="width:${100*(s.index+(done?1:0))/s.qids.length}%"></i></div><div class="recall-clock ${s.mode==='speed'?'countdown':''}" id="recallClock" aria-label="${s.mode==='speed'?'남은 시간':'생각한 시간'}">${clock(s.mode==='speed'?s.deadlineMs-Date.now():s.elapsedMs)}</div></div>
      <div class="recall-question-grid"><section class="recall-question-card"><div class="recall-card-heading"><span class="recall-level">STEP 03</span><span class="small muted">빈칸에 들어갈 핵심어</span></div><h1>${esc(q.cue)}</h1><p class="recall-prompt">${sentence(q,done)}</p>
      ${c.hinted&&!done?`<p class="recall-mobile-hint">초성 <b>${esc(initials(q.answer))}</b><small>띄어쓰기 제외 ${normalize(q.answer).length}글자</small></p>`:''}${!done?`<form id="recallAnswerForm" novalidate><label for="recallAnswer">떠오른 핵심어를 써 보세요.</label><div class="recall-answer-row"><input id="recallAnswer" name="keyword" type="text" value="${esc(c.input)}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" placeholder="핵심어 입력" enterkeyhint="done" aria-describedby="recallFeedback"><button type="submit" class="btn">정답 확인 ↵</button></div></form><p id="recallFeedback" class="recall-feedback" role="status">${esc(c.message||'띄어쓰기 없이 입력해도 괜찮아요.')}</p><div class="recall-help-row"><button class="ghost" data-recall="hint" ${c.hinted?'disabled':''}>${c.hinted?'초성 열림':'초성 보기'}</button><button class="recall-text-button" data-recall="reveal">정답 확인하고 넘기기</button></div>`:`<div class="recall-answer-feedback ${c.status==='correct'?'success':'revealed'}" role="status"><b>${c.status==='correct'?(c.hinted||c.attempts>1?'초성의 도움으로 떠올렸어요.':'스스로 떠올렸어요!'):'다시 떠올려 볼 핵심어'}</b><p>정답: <strong>${esc(q.answer)}</strong></p></div><div class="recall-explanation"><p>${esc(q.explanation)}</p><span class="small muted">교과서 근거 · ${source(q)}</span></div><button class="btn recall-next" data-recall="next">${s.index===s.qids.length-1?'결과 보기':'다음 문제'} →</button>`}
      </section><aside class="recall-play-aside"><div class="recall-hint-box ${c.hinted?'open':''}"><span class="eyebrow">THINKING CLUE</span><h2>생각의 실마리</h2>${c.hinted?`<p class="recall-initials" aria-label="초성 ${esc(initials(q.answer))}">${esc(initials(q.answer))}</p><p class="small muted">띄어쓰기 제외 ${normalize(q.answer).length}글자</p>`:'<p class="recall-locked">?</p><p class="small muted">먼저 스스로 생각해 보세요.<br>첫 오답에는 초성이 자동으로 열립니다.</p>'}</div><dl class="recall-score"><div><dt>혼자 떠올림</dt><dd>${st.independent}</dd></div><div><dt>초성 도움</dt><dd>${st.helped}</dd></div><div><dt>미해결</dt><dd>${st.unresolved}</dd></div></dl><p class="small muted">힌트를 쓰거나 정답을 확인한 문제는<br>‘다시 볼 핵심어’에 모아 둡니다.</p><p id="recallStorage" class="small muted">${canStore?'자동 저장 중':'이 창에서만 기록 유지'}</p></aside></div></div>`,scroll);
    if(!done){const input=document.querySelector('#recallAnswer');input.focus({preventScroll:true});if(c.attempts)input.select();}
    else document.querySelector('[data-recall="next"]').focus({preventScroll:true});
  }
  function addWeak(id){data.weak=[...new Set([...data.weak,id])];const q=byId.get(id);if(q&&window.Wordbook)window.Wordbook.autoAdd(q.conceptId,'키워드 게임에서 막힘');}
  function record(outcome){
    const s=data.session,q=currentQuestion(),c=s.current;
    if(s.answers.some(a=>a.id===q.id))return;
    s.answers.push({id:q.id,outcome,input:c.input,attempts:c.attempts,hinted:c.hinted});
    if(['independent','helped'].includes(outcome))window.CivicJourney.recordRecall(q.id);
    if(outcome==='independent')data.weak=data.weak.filter(id=>id!==q.id);else addWeak(q.id);
  }
  function submit(){
    if(!ensureAccess())return;
    pulse();const s=data.session;if(!s||s.current.status!=='pending')return;
    const q=currentQuestion(),c=s.current,input=document.querySelector('#recallAnswer');c.input=input?.value||'';
    if(!normalize(c.input)){c.message='빈칸에 들어갈 핵심어를 입력해 주세요.';renderQuestion(false);return;}
    c.attempts++;
    if([q.answer,...q.aliases].some(a=>normalize(a)===normalize(c.input))){c.status='correct';record(c.hinted||c.attempts>1?'helped':'independent');}
    else{c.hinted=true;c.message='한 번 더 떠올려 보세요. 초성 힌트가 열렸어요.';addWeak(q.id);}
    persist();renderQuestion(false);
  }
  function next(){
    if(!ensureAccess())return;pulse();if(!data.session||data.session.current.status==='pending')return;const s=data.session;s.index++;if(s.index>=s.qids.length){finish('complete');return;}s.current=resetCurrent();lastPulse=Date.now();persist();renderQuestion();}
  function finish(reason,show=true){
    const s=data.session;if(!s)return;
    if(s.index<s.qids.length&&s.current.status==='pending')record('unanswered');
    const elapsed=s.mode==='speed'?Math.min(s.duration*1000,Date.now()-s.startedAt):s.elapsedMs;
    data.lastResult={mode:s.mode,qids:s.qids,answers:s.answers,elapsedMs:elapsed,reason,finishedAt:Date.now()};data.session=null;persist();if(show)renderResult(data.lastResult);
  }
  function renderResult(result){
    if(!ensureAccess())return;
    if(!result)return renderSetup();
    const st=stats(result.answers),review=result.answers.filter(a=>a.outcome!=='independent'),correct=st.independent+st.helped;
    setScreen('recall-result',`<div class="wrap recall-wrap"><div class="recall-heading"><div><span class="eyebrow">YOUR RECALL RECORD</span><h1>${result.reason==='timeout'?'시간 종료! 얼마나 떠올렸을까?':'머릿속 기록을 꺼냈어요.'}</h1><p class="muted">${result.mode==='speed'?'스피드 도전':'기억 연습'} · ${clock(result.elapsedMs)} · ${result.answers.length}문항 확인 / ${result.qids.length}문항</p></div><div class="recall-result-total"><strong>${correct}</strong><span>문항 정답</span></div></div>
      <div class="recall-result-stats"><div><b>${st.independent}</b><span>혼자 떠올림</span></div><div><b>${st.helped}</b><span>초성 도움</span></div><div><b>${st.unresolved}</b><span>미해결</span></div><div><b>${Math.max(0,result.qids.length-result.answers.length)}</b><span>아직 안 푼 문제</span></div></div>
      <div data-growth-summary>${window.CivicJourney.summaryHTML()}</div><div class="recall-result-actions"><button class="btn" data-recall="review-result" ${review.length?'':'disabled'}>다시 볼 ${review.length}문항 연습 →</button><button class="ghost" data-recall="open">단원·방법 다시 고르기</button></div>
      <p class="small muted">초성의 도움을 받았거나 정답을 확인한 문제를 한 번 더 풀어 보세요. 도움 없이 맞히면 ‘다시 볼 핵심어’에서 빠집니다.</p>
      <div class="recall-results-list">${result.answers.map(a=>{const q=byId.get(a.id);return `<details class="recall-result-item"><summary><span class="recall-outcome ${a.outcome}">${{independent:'혼자 성공',helped:'초성 도움',revealed:'정답 확인',unanswered:'미해결'}[a.outcome]}</span><b>${esc(q.cue)}</b><span>${esc(q.answer)}</span></summary><div><p>${sentence(q,true)}</p><p class="small muted">${a.input?'내가 쓴 답: '+esc(a.input)+' · ':''}${source(q)}</p><p class="small">${esc(q.explanation)}</p></div></details>`}).join('')}</div><p id="recallStorage" class="small muted">${canStore?'이 결과는 현재 기기의 브라우저에 저장됩니다.':'이 결과는 현재 창에서만 유지됩니다.'}</p></div>`);
  }
  function pulse(){
    if(!window.CivicJourney.canRecall()){lastPulse=Date.now();return;}
    const now=Date.now(),delta=Math.max(0,Math.min(1500,now-lastPulse));lastPulse=now;
    const s=data.session;if(!s)return;
    if(s.mode==='speed'&&now>=s.deadlineMs){finish('timeout',screen==='recall-play');return;}
    if(s.mode==='practice'&&screen==='recall-play'&&!document.hidden&&document.querySelector('#modal').classList.contains('hide')&&s.current.status==='pending')s.elapsedMs+=delta;
    if(screen==='recall-play'){
      const el=document.querySelector('#recallClock');if(el){el.textContent=clock(s.mode==='speed'?s.deadlineMs-now:s.elapsedMs);el.classList.toggle('urgent',s.mode==='speed'&&s.deadlineMs-now<=15000);}
    }
    if(now-lastSave>5000){lastSave=now;persist();}
  }
  document.addEventListener('submit',event=>{if(event.target.id!=='recallAnswerForm')return;event.preventDefault();if(composing||Date.now()-lastImeCommit<80)return;submit();});
  document.addEventListener('compositionstart',event=>{if(event.target.id==='recallAnswer')composing=true;});
  document.addEventListener('compositionend',event=>{if(event.target.id==='recallAnswer'){composing=false;lastImeCommit=Date.now();}});
  document.addEventListener('keydown',event=>{if(event.target.id==='recallAnswer'&&event.key==='Enter'&&(event.isComposing||event.keyCode===229||composing)){event.preventDefault();lastImeCommit=Date.now();}});
  document.addEventListener('input',event=>{if(event.target.id==='recallAnswer'&&data.session){data.session.current.input=event.target.value;persist();}});
  document.addEventListener('change',event=>{
    if(event.target.dataset.recallUnit){const id=event.target.dataset.recallUnit;data.settings.selected=event.target.checked?[...new Set([...data.settings.selected,id])]:data.settings.selected.filter(x=>x!==id);persist();renderSetup(false);document.querySelector(`[data-recall-unit="${id}"]`).focus({preventScroll:true});}
    else if(event.target.id==='recallCount'){data.settings.count=Number(event.target.value);persist();renderSetup(false);document.querySelector('#recallCount').focus({preventScroll:true});}
    else if(event.target.id==='recallDuration'){data.settings.duration=Number(event.target.value);persist();}
  });
  document.addEventListener('click',event=>{
    const b=event.target.closest('[data-recall]');if(!b||b.disabled)return;if(!ensureAccess())return;pulse();const action=b.dataset.recall;
    if(action==='open')open();
    else if(action==='mode'){data.settings.mode=b.dataset.value;persist();renderSetup(false);document.querySelector(`[data-recall="mode"][data-value="${data.settings.mode}"]`).focus({preventScroll:true});}
    else if(action==='scope'){const value=b.dataset.value;data.settings.selected=value==='all'?[...unitMap.keys()]:value==='none'?[]:window.SOCIAL_UNITS.filter(u=>u.book===Number(value)).map(u=>u.id);persist();renderSetup(false);document.querySelector(`[data-recall="scope"][data-value="${value}"]`).focus({preventScroll:true});}
    else if(action==='start')begin();
    else if(action==='replace-session'){closeModal();finish('ended',false);start(candidateIds());}
    else if(action==='resume'){if(data.session)renderQuestion();else if(data.lastResult)renderResult(data.lastResult);}
    else if(action==='last-result')renderResult(data.lastResult);
    else if(action==='hint'&&data.session){const c=data.session.current;if(c.status!=='pending')return;c.hinted=true;c.message='초성을 보고 핵심어를 떠올려 보세요.';addWeak(currentQuestion().id);persist();renderQuestion(false);}
    else if(action==='reveal'&&data.session){if(data.session.current.status!=='pending')return;data.session.current.status='revealed';record('revealed');persist();renderQuestion(false);}
    else if(action==='next')next();
    else if(action==='exit'&&data.session){if(data.session.mode==='practice'){persist();renderSetup();}else showModal('도전을 마칠까요?','<p>현재까지의 결과를 확인하고 이번 스피드 도전을 마칩니다.</p><div class="row"><button class="btn" data-recall="end-confirm">결과 보기</button><button class="ghost" data-action="close-modal">계속 도전</button></div>');}
    else if(action==='end-confirm'){closeModal();finish('ended');}
    else if(action==='review-result'){const ids=data.lastResult?.answers.filter(a=>a.outcome!=='independent').map(a=>a.id)||[];if(data.session)finish('ended',false);start(ids,'practice',true);}
    else if(action==='weak'){if(data.session)finish('ended',false);start([...data.weak],'practice',true);}
    else if(action==='reset')showModal('키워드 게임 기록을 지울까요?','<p>키워드 게임의 진행, 결과, 다시 볼 핵심어와 키워드 성장 기록을 초기화합니다. 기본 개념 연결 완료 기록과 키워드 게임 열림 상태는 유지됩니다.</p><div class="row"><button class="btn" data-recall="reset-confirm">초기화</button><button class="ghost" data-action="close-modal">취소</button></div>');
    else if(action==='reset-confirm'){data=defaultState();persist();window.CivicJourney.resetRecall();closeModal();renderSetup();}
  });
  document.addEventListener('visibilitychange',()=>{lastPulse=Date.now();persist();if(!document.hidden)pulse();});
  window.addEventListener('pagehide',()=>{pulse();persist();});
  setInterval(pulse,200);
  window.RecallGame={open,initials,normalize,resetForJourney(){data=defaultState();persist();}};
})();

</script>
<script data-bundle-source="wordbook.js">
'use strict';
/* 단어장 — 틀린 개념을 모아 다시 학습한다. 코드별로 분리 저장된다. */
(() => {
  const KEY = 'youngpa-social-wordbook-v1';
  const units = window.SOCIAL_UNITS || [];
  const byConcept = new Map();
  for (const u of units) for (const c of u.concepts) byConcept.set(c.id, {concept:c, unit:u});
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } };
  const raw = load();
  let data = (raw && raw.version === 1 && Array.isArray(raw.items))
    ? {version:1, items: raw.items.filter(i => i && byConcept.has(i.id))}
    : {version:1, items: []};
  let canStore = true;
  const listeners = [];
  function persist(){
    try { localStorage.setItem(KEY, JSON.stringify(data)); canStore = true; } catch { canStore = false; }
    for (const fn of listeners) { try { fn(); } catch {} }
  }
  const get = id => data.items.find(i => i.id === id) || null;

  function add(conceptId, reason, auto){
    if (!byConcept.has(conceptId)) return false;
    const found = get(conceptId);
    if (found) {
      if (auto) { found.misses = (found.misses || 0) + 1; found.mastered = false; found.lastAt = new Date().toISOString(); persist(); }
      return false;
    }
    data.items.push({id:conceptId, reason: String(reason || '직접 저장'), source: auto ? 'auto' : 'manual',
      addedAt:new Date().toISOString(), lastAt:null, misses: auto ? 1 : 0, hits:0, mastered:false});
    persist();
    return true;
  }

  window.Wordbook = {
    subscribe: fn => listeners.push(fn),
    canStore: () => canStore,
    count: () => data.items.length,
    dueCount: () => data.items.filter(i => !i.mastered).length,
    has: id => !!get(id),
    entry: id => { const e = get(id); return e ? {...e} : null; },
    info: id => byConcept.get(id) || null,
    add: (id, reason) => add(id, reason || '직접 저장', false),
    autoAdd(id, reason){ if (id) add(id, reason || '게임에서 막힘', true); },
    remove(id){ const n = data.items.length; data.items = data.items.filter(i => i.id !== id); if (n !== data.items.length) persist(); },
    clear(){ data.items = []; persist(); },
    toggle(id, reason){ if (get(id)) { this.remove(id); return false; } return add(id, reason || '직접 저장', false); },
    mark(id, ok){
      const e = get(id); if (!e) return;
      e.lastAt = new Date().toISOString();
      if (ok) { e.hits = (e.hits || 0) + 1; if (e.hits >= 2) e.mastered = true; }
      else { e.misses = (e.misses || 0) + 1; e.hits = 0; e.mastered = false; }
      persist();
    },
    all(){
      return data.items.map(i => {
        const m = byConcept.get(i.id);
        return {...i, term:m.concept.term, definition:m.concept.definition, compare:m.concept.compare,
          page:m.concept.page, unitId:m.unit.id, unitTitle:m.unit.title, book:m.unit.book, number:m.unit.number};
      }).sort((a,b) => (a.mastered - b.mastered) || (a.unitId < b.unitId ? -1 : 1) || a.page - b.page);
    }
  };
})();

</script>
<script data-bundle-source="tree.js">
'use strict';
/* 개념 트리 — 연관 개념을 하나로 묶고, 상위·하위를 연결하는 게임. */
(() => {
  const KEY = 'youngpa-social-tree-v1';
  const trees = window.SOCIAL_TREES || [];
  const units = window.SOCIAL_UNITS || [];
  const unitMap = new Map(units.map(u => [u.id, u]));
  const termMap = new Map();
  for (const u of units) for (const c of u.concepts) termMap.set(c.term, {...c, unitId:u.id, book:u.book, number:u.number});
  const byId = new Map(trees.map(t => [t.id, t]));
  const ids = new Set(trees.map(t => t.id));

  const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch { return null; } };
  const raw = load();
  let data = (raw && raw.version === 1 && raw.cleared && typeof raw.cleared === 'object')
    ? {version:1, cleared:Object.fromEntries(Object.entries(raw.cleared).filter(([k]) => ids.has(k))), last: ids.has(raw.last) ? raw.last : null}
    : {version:1, cleared:{}, last:null};
  let canStore = true;
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(data)); canStore = true; } catch { canStore = false; } }

  const shuffled = a => { const b = [...a]; for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
  const clearedCount = () => Object.keys(data.cleared).length;
  const isCleared = id => !!data.cleared[id];
  const ref = t => { const u = unitMap.get(t.unitId); return u ? `사회${u.book === 1 ? '①' : '②'} · ${u.number}단원 · ${t.page}쪽` : `${t.page}쪽`; };
  const label = term => { const c = termMap.get(term); return c ? c.term : term; };

  let play = null; // {tree, cards:[{term,group}], placed:{cardIndex:groupIndex}, picked:Set, tries, checked, wrong:Set, missing:[], revealed}

  function stage(t){
    const cards = t.mode === 'collect'
      ? shuffled([...t.groups[0].children.map(c => ({term:c, group:0})), ...t.distractors.map(d => ({term:d, group:-1}))])
      : shuffled(t.groups.flatMap((g,i) => g.children.map(c => ({term:c, group:i}))));
    play = {tree:t, cards, placed:{}, picked:new Set(), selected:null, tries:0, checked:false, wrong:new Set(), missing:[], revealed:false, notice:''};
  }

  function conceptLine(term){
    const c = termMap.get(term);
    if (!c) return `<b>${esc(term)}</b>`;
    return `<b>${esc(c.term)}</b><span>${esc(c.definition)}</span><small>${c.page}쪽</small>`;
  }

  // ---------- 목록 ----------
  function open(){
    closeModal(); activeUnit = null;
    const total = trees.length, done = clearedCount();
    const groups = units.map(u => ({unit:u, items:trees.filter(t => t.unitId === u.id)})).filter(g => g.items.length);
    setScreen('tree', `<div class="wrap">
      <div class="recall-heading"><div><span class="eyebrow">STEP 04 · CONCEPT TREE</span><h1>개념 트리 만들기</h1>
      <p class="muted">연관 있는 개념을 하나로 묶고, 상위 개념과 하위 개념을 연결해 보세요.</p></div>
      <span class="recall-count"><b>${done}</b> / ${total} 트리 완성</span></div>
      <div class="growth-track" role="progressbar" aria-label="개념 트리 진행" aria-valuenow="${done}" aria-valuemin="0" aria-valuemax="${total}"><i style="width:${total ? Math.round(done/total*100) : 0}%"></i></div>
      <div class="row tree-top-actions">
        <button class="btn" data-ext="tree-next">${done ? '이어서 하기' : '처음부터 시작'} →</button>
        ${done ? '<button class="ghost" data-ext="tree-review">완성한 트리 복습</button>' : ''}
        <button class="ghost" data-ext="wordbook">단어장 ${window.Wordbook ? window.Wordbook.count() : 0}개</button>
        ${done ? '<button class="ghost" data-ext="tree-reset">개념 트리 기록 초기화</button>' : ''}
      </div>
      ${groups.map(g => `<section class="tree-unit"><h2 class="chapter-label">사회${g.unit.book === 1 ? '①' : '②'} ${g.unit.number}. ${esc(g.unit.title)}</h2>
        <div class="tree-list">${g.items.map(t => `<button class="tree-card ${isCleared(t.id) ? 'done' : ''}" data-ext="tree-play" data-id="${t.id}">
          <span class="tree-mode">${t.mode === 'collect' ? '개념 묶기' : '상위·하위 연결'}</span>
          <b>${esc(t.title)}</b>
          <small>${t.mode === 'collect' ? `하위 개념 ${t.groups[0].children.length}개` : `상위 개념 ${t.groups.length}개 · 카드 ${t.groups.reduce((n,x) => n + x.children.length, 0)}장`}</small>
          <span class="tree-state">${isCleared(t.id) ? '완성 ✓ 다시 보기' : '도전하기 →'}</span></button>`).join('')}</div></section>`).join('')}
      <p class="small muted">${canStore ? '개념 트리 기록은 지금 쓰는 학습 코드에 저장됩니다.' : '이 브라우저에서는 기록을 저장할 수 없어 현재 창에서만 유지됩니다.'}</p>
    </div>`);
  }

  function next(){
    const target = trees.find(t => !isCleared(t.id)) || byId.get(data.last) || trees[0];
    if (target) start(target.id);
  }
  function start(id){
    const t = byId.get(id); if (!t) return;
    stage(t); data.last = id; persist(); render();
  }

  // ---------- 풀이 화면 ----------
  function render(scroll = true){
    const t = play.tree, g = t.groups;
    const head = `<div class="wrap screen">
      <div class="topline"><div><span class="eyebrow">CONCEPT TREE · ${t.mode === 'collect' ? '개념 묶기' : '상위·하위 연결'}</span>
      <div class="small muted">${ref(t)}</div></div>
      <button class="ghost small" data-ext="tree-home">저장 · 트리 목록</button></div>
      <h1 class="tree-title">${esc(t.title)}</h1><p class="muted tree-prompt">${esc(t.prompt)}</p>`;

    if (t.mode === 'collect') {
      const root = g[0];
      const rootDef = root.rootTerm ? termMap.get(root.rootTerm) : null;
      setScreen('tree-play', head + `
        <div class="tree-root"><span>상위 개념</span><b>${esc(root.rootTerm || root.label)}</b>
        ${rootDef ? `<p>${esc(rootDef.definition)}</p><small>${rootDef.page}쪽</small>` : `<p class="muted">이 묶음에 들어갈 하위 개념을 고르세요.</p>`}</div>
        <div class="tree-branch" aria-hidden="true"></div>
        <div class="tree-pool" role="group" aria-label="개념 카드">
          ${play.cards.map((c,i) => {
            const picked = play.picked.has(i);
            const state = play.checked ? (play.wrong.has(i) ? 'bad' : (picked ? 'good' : '')) : '';
            const reveal = play.revealed && c.group === 0 && !picked ? 'missed' : '';
            return `<button class="tree-chip ${picked ? 'picked' : ''} ${state} ${reveal}" data-ext="tree-pick" data-i="${i}" aria-pressed="${picked}"><span class="chip-label">${esc(label(c.term))}</span>${play.checked && play.wrong.has(i) ? '<i>✗</i>' : (play.checked && picked ? '<i>✓</i>' : '')}${reveal ? '<i>+</i>' : ''}</button>`;
          }).join('')}
        </div>
        ${notice()}
        <div class="row tree-actions">
          <button class="btn" data-ext="tree-check" ${play.picked.size ? '' : 'disabled'}>확인</button>
          <button class="ghost" data-ext="tree-clearpick" ${play.picked.size ? '' : 'disabled'}>선택 비우기</button>
          ${play.tries >= 2 && !play.revealed ? '<button class="ghost" data-ext="tree-reveal">정답 보기</button>' : ''}
        </div></div>`, scroll);
      return;
    }

    setScreen('tree-play', head + `
      <div class="tree-columns">${g.map((grp,gi) => {
        const rootDef = grp.rootTerm ? termMap.get(grp.rootTerm) : null;
        const mine = Object.entries(play.placed).filter(([,v]) => v === gi).map(([k]) => Number(k));
        return `<div class="tree-column"><button class="tree-colhead ${play.selected !== null ? 'ready' : ''}" data-ext="tree-drop" data-g="${gi}">
          <span>상위 개념</span><b class="col-label">${esc(grp.rootTerm || grp.label)}</b>${rootDef ? `<small>${esc(rootDef.definition)}</small>` : ''}
          ${play.selected !== null ? '<em>여기에 넣기</em>' : ''}</button>
          <div class="tree-slot">${mine.length ? mine.map(i => {
            const bad = play.checked && play.wrong.has(i);
            return `<button class="tree-chip placed ${bad ? 'bad' : (play.checked ? 'good' : '')}" data-ext="tree-unplace" data-i="${i}"><span class="chip-label">${esc(label(play.cards[i].term))}</span>${bad ? '<i>✗</i>' : (play.checked ? '<i>✓</i>' : '')}</button>`;
          }).join('') : '<p class="small muted">아직 비어 있어요.</p>'}</div></div>`;
      }).join('')}</div>
      <h3 class="tree-pool-label">옮길 개념 카드</h3>
      <div class="tree-pool" role="group" aria-label="개념 카드">
        ${play.cards.map((c,i) => i in play.placed ? '' : `<button class="tree-chip ${play.selected === i ? 'picked' : ''}" data-ext="tree-select" data-i="${i}" aria-pressed="${play.selected === i}"><span class="chip-label">${esc(label(c.term))}</span></button>`).join('') || '<p class="small muted">모든 카드를 옮겼어요. 확인을 눌러 보세요.</p>'}
      </div>
      ${notice()}
      <div class="row tree-actions">
        <button class="btn" data-ext="tree-check" ${Object.keys(play.placed).length === play.cards.length ? '' : 'disabled'}>확인</button>
        <button class="ghost" data-ext="tree-clearpick" ${Object.keys(play.placed).length ? '' : 'disabled'}>모두 되돌리기</button>
        ${play.tries >= 2 && !play.revealed ? '<button class="ghost" data-ext="tree-reveal">정답 보기</button>' : ''}
      </div></div>`, scroll);
  }
  function notice(){ return play.notice ? `<p class="tree-notice ${play.wrong.size || play.missing.length ? 'warn' : ''}" role="status">${esc(play.notice)}</p>` : ''; }

  // ---------- 조작 ----------
  function pick(i){
    if (play.picked.has(i)) play.picked.delete(i); else play.picked.add(i);
    play.checked = false; play.wrong = new Set(); play.notice = ''; render(false);
  }
  function select(i){ play.selected = play.selected === i ? null : i; play.checked = false; play.wrong = new Set(); play.notice = ''; render(false); }
  function drop(gi){
    if (play.selected === null) { play.notice = '먼저 아래에서 개념 카드를 하나 고르세요.'; render(false); return; }
    play.placed[play.selected] = gi; play.selected = null; play.checked = false; play.wrong = new Set(); play.notice = '';
    render(false);
  }
  function unplace(i){ delete play.placed[i]; play.checked = false; play.wrong = new Set(); play.notice = ''; render(false); }
  function clearPick(){ play.picked = new Set(); play.placed = {}; play.selected = null; play.checked = false; play.wrong = new Set(); play.notice = ''; render(false); }

  function toWordbook(terms, why){
    if (!window.Wordbook) return;
    for (const term of terms) { const c = termMap.get(term); if (c) window.Wordbook.autoAdd(c.id, why); }
  }

  function check(){
    const t = play.tree;
    play.tries++; play.checked = true; play.wrong = new Set(); play.missing = [];
    if (t.mode === 'collect') {
      play.cards.forEach((c,i) => { if (play.picked.has(i) && c.group !== 0) play.wrong.add(i); });
      play.missing = play.cards.filter((c,i) => c.group === 0 && !play.picked.has(i)).map(c => c.term);
    } else {
      play.cards.forEach((c,i) => { if (play.placed[i] !== c.group) play.wrong.add(i); });
    }
    const wrongTerms = [...play.wrong].map(i => play.cards[i].term);
    if (!play.wrong.size && !play.missing.length) { succeed(); return; }
    toWordbook([...wrongTerms, ...play.missing], '개념 트리에서 틀림');
    const parts = [];
    if (play.wrong.size) parts.push(`잘못 놓은 카드 ${play.wrong.size}장`);
    if (play.missing.length) parts.push(`아직 못 찾은 개념 ${play.missing.length}개`);
    play.notice = parts.join(' · ') + '. 틀린 개념은 단어장에 담았어요. 뜻을 다시 떠올려 보세요.';
    persist(); render(false);
    announce(play.notice);
  }
  function reveal(){
    const t = play.tree;
    play.revealed = true; play.checked = true;
    if (t.mode === 'collect') {
      play.picked = new Set(play.cards.map((c,i) => c.group === 0 ? i : -1).filter(i => i >= 0));
      play.wrong = new Set();
    } else {
      play.placed = {}; play.cards.forEach((c,i) => { play.placed[i] = c.group; });
      play.wrong = new Set();
    }
    toWordbook(t.groups.flatMap(g => g.children), '개념 트리에서 정답 확인');
    play.notice = '정답 배치를 보여 줄게요. 트리를 눈으로 익힌 뒤 다시 도전해 보세요.';
    render(false);
  }
  function succeed(){
    const t = play.tree, rec = data.cleared[t.id] || {tries:0, misses:0};
    data.cleared[t.id] = {tries: rec.tries + play.tries, misses: rec.misses, clearedAt: new Date().toISOString()};
    persist();
    if (!play.revealed) toast('개념 트리 완성!');
    result(t);
  }

  function result(t){
    const done = clearedCount(), total = trees.length;
    const nextTree = trees.find(x => !isCleared(x.id));
    setScreen('tree-result', `<div class="wrap screen">
      <div class="topline"><div><span class="eyebrow">TREE COMPLETE</span><div class="small muted">${ref(t)}</div></div>
      <button class="ghost small" data-ext="tree-home">트리 목록</button></div>
      <h1 class="tree-title">${esc(t.title)} 트리를 완성했어요.</h1>
      <div class="tree-done">${t.groups.map(g => {
        const rootDef = g.rootTerm ? termMap.get(g.rootTerm) : null;
        return `<div class="tree-done-group"><div class="tree-done-root"><span>상위</span><b>${esc(g.rootTerm || g.label)}</b>${rootDef ? `<p>${esc(rootDef.definition)}</p>` : ''}</div>
          <ul class="tree-done-children">${g.children.map(c => `<li>${conceptLine(c)}</li>`).join('')}</ul></div>`;
      }).join('')}</div>
      ${t.note ? `<div class="tree-note"><b>교과서 확인</b><p>${esc(t.note)}</p></div>` : ''}
      <p class="small muted">개념 트리 ${done} / ${total} 완성</p>
      <div class="row tree-actions">
        ${nextTree ? `<button class="btn" data-ext="tree-play" data-id="${nextTree.id}">다음 트리 · ${esc(nextTree.title)} →</button>` : '<button class="btn" data-ext="tree-home">모든 트리를 완성했어요 →</button>'}
        <button class="ghost" data-ext="tree-play" data-id="${t.id}">이 트리 다시 하기</button>
        <button class="ghost" data-ext="wordbook">단어장 보기</button>
      </div></div>`);
  }

  function reviewPick(){
    const done = trees.filter(t => isCleared(t.id));
    if (!done.length) { toast('아직 완성한 트리가 없어요.'); return; }
    showModal('완성한 트리 복습', `<p>다시 만들어 볼 트리를 고르세요. 복습해도 완성 기록은 그대로 남아요.</p>
      <div class="completion-list">${done.map(t => `<div><span>${esc(t.title)}</span><button class="ghost small" data-ext="tree-play" data-id="${t.id}">다시 만들기</button></div>`).join('')}</div>`);
  }

  window.TreeGame = {
    open, start, next,
    total: () => trees.length,
    cleared: () => clearedCount(),
    reset(){ data = {version:1, cleared:{}, last:null}; persist(); },
    handle(action, el){
      if (action === 'tree') { open(); return true; }
      if (action === 'tree-home') { open(); return true; }
      if (action === 'tree-next') { next(); return true; }
      if (action === 'tree-review') { reviewPick(); return true; }
      if (action === 'tree-play') { closeModal(); start(el.dataset.id); return true; }
      if (!play && ['tree-pick','tree-select','tree-drop','tree-unplace','tree-check','tree-clearpick','tree-reveal'].includes(action)) { open(); return true; }
      if (action === 'tree-pick') { pick(Number(el.dataset.i)); return true; }
      if (action === 'tree-select') { select(Number(el.dataset.i)); return true; }
      if (action === 'tree-drop') { drop(Number(el.dataset.g)); return true; }
      if (action === 'tree-unplace') { unplace(Number(el.dataset.i)); return true; }
      if (action === 'tree-check') { check(); return true; }
      if (action === 'tree-clearpick') { clearPick(); return true; }
      if (action === 'tree-reveal') { reveal(); return true; }
      if (action === 'tree-reset') {
        showModal('개념 트리 기록을 초기화할까요?', '<p>완성한 트리 기록만 지웁니다. 기본 개념 연결·키워드 게임·단어장은 그대로 남습니다.</p><div class="row"><button class="btn" data-ext="tree-reset-confirm">초기화</button><button class="ghost" data-action="close-modal">취소</button></div>');
        return true;
      }
      if (action === 'tree-reset-confirm') { this.reset(); closeModal(); open(); toast('개념 트리 기록을 초기화했습니다.'); return true; }
      return false;
    }
  };
})();

</script>
<script data-bundle-source="extras.js">
'use strict';
/* 학습 코드 화면·단어장 화면·개념 트리 연결 및 상단 메뉴 추가. */
(() => {
  const A = window.Accounts, WB = window.Wordbook, TG = window.TreeGame;
  const PRIVACY = '실명, 실제 학번, 사진은 입력하지 않습니다. 모든 기록은 이 기기의 브라우저에만 저장되며 어디에도 전송되지 않습니다.';

  // ---------- 상단 메뉴 ----------
  function buildNav(){
    const nav = document.querySelector('header nav'); if (!nav) return;
    const growth = nav.querySelector('[data-action="growth"]');
